<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python Quiz Game</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: var(--text);
      padding: 1.5rem;
    }

    .container { max-width: 640px; margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .topbar h1 { font-size: 1.4rem; }
    .topbar .user { color: var(--muted); font-size: 0.9rem; }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--muted); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      margin-bottom: 1.25rem;
    }

    .progress {
      height: 6px;
      background: #0f172a;
      border-radius: 3px;
      margin-bottom: 1.25rem;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
      width: 0%;
    }

    .q-num {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.25rem;
      line-height: 1.45;
    }

    .options { display: flex; flex-direction: column; gap: 0.6rem; }

    .option {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: #0f172a;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .option:hover { border-color: var(--primary); }
    .option.selected {
      border-color: var(--primary);
      background: rgba(59, 130, 246, 0.15);
    }

    .option input { display: none; }

    .option .letter {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      flex-shrink: 0;
    }

    .option.selected .letter {
      background: var(--primary);
      color: white;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }

    .nav .btn { flex: 1; padding: 0.75rem; }

    .result-score {
      text-align: center;
      padding: 1.5rem 0;
    }

    .result-score .big {
      font-size: 3rem;
      font-weight: 700;
      color: var(--primary);
    }

    .result-score .pct {
      color: var(--muted);
      margin-top: 0.25rem;
    }

    .result-list { margin-top: 1.25rem; }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .result-item:last-child { border-bottom: none; }
    .badge-ok { color: var(--success); }
    .badge-no { color: var(--error); }

    .hidden { display: none !important; }

    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }

    .error-box {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: var(--error);
      border-radius: 10px;
      padding: 1rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>Python Quiz Game</h1>
        <div class="user" id="userLabel">Loading...</div>
      </div>
      <button class="btn btn-ghost" id="logoutBtn">Logout</button>
    </div>

    <div id="loading" class="card loading">Loading quiz...</div>
    <div id="authError" class="card error-box hidden">
      You need to log in first.
      <br /><br />
      <a href="/" style="color: var(--primary)">Go to Register / Login</a>
    </div>

    <div id="quizArea" class="hidden">
      <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

      <div class="card" id="questionCard">
        <div class="q-num" id="qNum"></div>
        <div class="q-text" id="qText"></div>
        <div class="options" id="options"></div>
        <div class="nav">
          <button class="btn btn-ghost" id="prevBtn">Previous</button>
          <button class="btn btn-primary" id="nextBtn">Next</button>
        </div>
      </div>
    </div>

    <div id="resultArea" class="hidden">
      <div class="card">
        <div class="result-score">
          <div class="big" id="scoreBig">0/10</div>
          <div class="pct" id="scorePct">0%</div>
          <p style="margin-top: 0.75rem; color: var(--muted)" id="scoreMsg"></p>
        </div>
        <div class="result-list" id="resultList"></div>
        <div class="nav" style="margin-top: 1.5rem">
          <button class="btn btn-primary" id="retryBtn">Try Again</button>
          <button class="btn btn-ghost" id="homeBtn">Home</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let questions = [];
    let current = 0;
    let answers = {};  // { "1": "b", ... }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function checkAuth() {
      try {
        const res = await fetch('/api/me', { credentials: 'include' });
        const data = await res.json();
        if (!data.logged_in) {
          document.getElementById('loading').classList.add('hidden');
          document.getElementById('authError').classList.remove('hidden');
          return false;
        }
        document.getElementById('userLabel').textContent = 'Playing as ' + data.username;
        return true;
      } catch {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('authError').classList.remove('hidden');
        return false;
      }
    }

    async function loadQuestions() {
      const res = await fetch('/api/quiz/questions', { credentials: 'include' });
      if (res.status === 401) {
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('authError').classList.remove('hidden');
        return;
      }
      const data = await res.json();
      questions = data.questions;
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('quizArea').classList.remove('hidden');
      renderQuestion();
    }

    function renderQuestion() {
      const q = questions[current];
      document.getElementById('qNum').textContent = `Question ${current + 1} of ${questions.length}`;
      document.getElementById('qText').textContent = q.question;
      document.getElementById('progressBar').style.width =
        ((current + 1) / questions.length * 100) + '%';

      const opts = document.getElementById('options');
      opts.innerHTML = '';
      for (const [letter, text] of Object.entries(q.options)) {
        const selected = answers[String(q.id)] === letter;
        const div = document.createElement('label');
        div.className = 'option' + (selected ? ' selected' : '');
        div.innerHTML = `
          <input type="radio" name="q" value="${letter}" ${selected ? 'checked' : ''} />
          <span class="letter">${letter.toUpperCase()}</span>
          <span>${escapeHtml(text)}</span>
        `;
        div.addEventListener('click', () => {
          answers[String(q.id)] = letter;
          renderQuestion();
        });
        opts.appendChild(div);
      }

      document.getElementById('prevBtn').disabled = current === 0;
      const nextBtn = document.getElementById('nextBtn');
      if (current === questions.length - 1) {
        nextBtn.textContent = 'Submit Quiz';
      } else {
        nextBtn.textContent = 'Next';
      }
    }

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    });

    document.getElementById('nextBtn').addEventListener('click', async () => {
      if (current < questions.length - 1) {
        current++;
        renderQuestion();
        return;
      }
      // Submit
      const nextBtn = document.getElementById('nextBtn');
      nextBtn.disabled = true;
      nextBtn.textContent = 'Submitting...';

      try {
        const res = await fetch('/api/quiz/submit', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answers }),
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('quizArea').classList.add('hidden');
          document.getElementById('resultArea').classList.remove('hidden');
          document.getElementById('scoreBig').textContent = `${data.score}/${data.total}`;
          document.getElementById('scorePct').textContent = `${data.percentage}%`;
          document.getElementById('scoreMsg').textContent = data.message;

          const list = document.getElementById('resultList');
          list.innerHTML = data.results.map(r => `
            <div class="result-item">
              <span>Q${r.id}</span>
              <span class="${r.correct ? 'badge-ok' : 'badge-no'}">
                ${r.correct ? '✓ Correct' : `✗ Correct: ${r.correct_answer.toUpperCase()}`}
              </span>
            </div>
          `).join('');
        } else {
          alert(data.error || 'Submit failed');
          nextBtn.disabled = false;
          nextBtn.textContent = 'Submit Quiz';
        }
      } catch {
        alert('Could not submit. Is the server running?');
        nextBtn.disabled = false;
        nextBtn.textContent = 'Submit Quiz';
      }
    });

    document.getElementById('retryBtn').addEventListener('click', () => {
      current = 0;
      answers = {};
      document.getElementById('resultArea').classList.add('hidden');
      document.getElementById('quizArea').classList.remove('hidden');
      document.getElementById('nextBtn').disabled = false;
      renderQuestion();
    });

    document.getElementById('homeBtn').addEventListener('click', () => {
      window.location.href = '/';
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST', credentials: 'include' });
      window.location.href = '/';
    });

    (async () => {
      const ok = await checkAuth();
      if (ok) await loadQuestions();
    })();
  </script>
</body>
</html>

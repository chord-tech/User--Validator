<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Py Quiz Game — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #070b14;
      --bg: #0c1220;
      --card: rgba(18, 28, 48, 0.85);
      --card-border: rgba(99, 140, 255, 0.12);
      --border: #243044;
      --text: #e8eef9;
      --muted: #8b9bb8;
      --primary: #4f8cff;
      --primary-glow: rgba(79, 140, 255, 0.35);
      --primary-hover: #3b7aef;
      --accent: #3ddc97;
      --success: #3ddc97;
      --error: #ff6b7a;
      --radius: 18px;
      --font: 'DM Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-deep);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(79, 140, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 100%, rgba(61, 220, 151, 0.1), transparent 45%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(145deg, #4f8cff, #3066d0);
      box-shadow: 0 8px 24px var(--primary-glow);
      margin-bottom: 1rem;
      font-family: var(--mono);
      font-weight: 600;
      font-size: 1.15rem;
      color: white;
    }

    .brand h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.35rem;
    }

    .brand p {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.75rem 1.6rem;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03) inset,
        0 24px 48px -16px rgba(0, 0, 0, 0.55);
    }

    .tabs {
      display: flex;
      padding: 4px;
      background: rgba(7, 11, 20, 0.6);
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 0.65rem;
      background: transparent;
      border: none;
      border-radius: 9px;
      color: var(--muted);
      font-family: var(--font);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px var(--primary-glow);
    }

    .tab:not(.active):hover {
      color: var(--text);
    }

    .form-group { margin-bottom: 1.1rem; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .input-wrapper { position: relative; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.8rem 1rem;
      padding-right: 2.75rem;
      background: rgba(7, 11, 20, 0.7);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: #5a6a85; }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    input.valid { border-color: var(--success); }
    input.invalid { border-color: var(--error); }

    .toggle-password {
      position: absolute;
      right: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.35rem;
      line-height: 1;
      border-radius: 6px;
    }

    .toggle-password:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.05);
    }

    .feedback {
      font-size: 0.78rem;
      margin-top: 0.35rem;
      min-height: 1.1rem;
    }

    .feedback.error { color: var(--error); }
    .feedback.success { color: var(--success); }

    .rules {
      background: rgba(7, 11, 20, 0.5);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.85rem 1rem;
      margin-bottom: 1.1rem;
      font-size: 0.8rem;
    }

    .rules h3 {
      font-size: 0.7rem;
      color: var(--muted);
      margin-bottom: 0.55rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
    }

    .rule {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.28rem;
      color: var(--muted);
      transition: color 0.2s;
    }

    .rule:last-child { margin-bottom: 0; }
    .rule.met { color: var(--success); }

    .rule .icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      background: rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .rule.met .icon {
      background: rgba(61, 220, 151, 0.2);
    }

    button[type="submit"] {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(145deg, #5a95ff, #3b7aef);
      color: white;
      border: none;
      border-radius: 12px;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s, opacity 0.2s;
      margin-top: 0.35rem;
      box-shadow: 0 6px 20px var(--primary-glow);
    }

    button[type="submit"]:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 28px var(--primary-glow);
    }

    button[type="submit"]:active:not(:disabled) {
      transform: translateY(0);
    }

    button[type="submit"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .banner {
      display: none;
      border-radius: 12px;
      padding: 0.9rem 1rem;
      text-align: center;
      margin-top: 1.15rem;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .banner.show {
      display: block;
      animation: slideUp 0.3s ease;
    }

    .banner.success {
      background: rgba(61, 220, 151, 0.12);
      border: 1px solid rgba(61, 220, 151, 0.35);
      color: var(--success);
    }

    .banner.error {
      background: rgba(255, 107, 122, 0.12);
      border: 1px solid rgba(255, 107, 122, 0.35);
      color: var(--error);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .footer {
      text-align: center;
      margin-top: 1.35rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    @media (max-width: 480px) {
      .card { padding: 1.4rem 1.2rem; }
      .brand h1 { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="logo">Py</div>
      <h1>Py Quiz Game</h1>
      <p>Test your Python basics — register or log in to play</p>
    </div>

    <div class="card">
      <div class="tabs">
        <button type="button" class="tab active" data-mode="register">Register</button>
        <button type="button" class="tab" data-mode="login">Login</button>
      </div>

      <form id="validatorForm" novalidate>
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <input type="text" id="username" placeholder="e.g. johndoe" autocomplete="username" />
          </div>
          <div class="feedback" id="usernameFeedback"></div>
        </div>

        <div class="rules" id="usernameRules">
          <h3>Username rules</h3>
          <div class="rule" id="rule-len"><span class="icon">○</span> At least 8 characters</div>
          <div class="rule" id="rule-space"><span class="icon">○</span> No spaces</div>
          <div class="rule" id="rule-digit"><span class="icon">○</span> No digits</div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" placeholder="Enter password" autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="password" aria-label="Toggle visibility">👁</button>
          </div>
          <div class="feedback" id="passwordFeedback"></div>
        </div>

        <div class="rules" id="passwordRules">
          <h3>Password rules</h3>
          <div class="rule" id="rule-plen"><span class="icon">○</span> At least 7 characters</div>
          <div class="rule" id="rule-pdigit"><span class="icon">○</span> At least one digit</div>
          <div class="rule" id="rule-pupper"><span class="icon">○</span> At least one uppercase letter</div>
        </div>

        <div class="form-group" id="confirmGroup">
          <label for="confirm">Confirm password</label>
          <div class="input-wrapper">
            <input type="password" id="confirm" placeholder="Confirm password" autocomplete="new-password" />
            <button type="button" class="toggle-password" data-target="confirm" aria-label="Toggle visibility">👁</button>
          </div>
          <div class="feedback" id="confirmFeedback"></div>
        </div>

        <button type="submit" id="submitBtn" disabled>Register &amp; Start Quiz</button>
      </form>

      <div class="banner" id="banner"></div>
    </div>

    <p class="footer">10 questions · 5 minute timer · Scores saved</p>
  </div>

  <script>
    const API = '';
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const confirmGroup = document.getElementById('confirmGroup');
    const usernameRules = document.getElementById('usernameRules');
    const passwordRules = document.getElementById('passwordRules');
    const submitBtn = document.getElementById('submitBtn');
    const banner = document.getElementById('banner');
    let mode = 'register';

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        mode = tab.dataset.mode;

        if (mode === 'register') {
          confirmGroup.classList.remove('hidden');
          usernameRules.classList.remove('hidden');
          passwordRules.classList.remove('hidden');
          submitBtn.textContent = 'Register & Start Quiz';
          passwordInput.autocomplete = 'new-password';
        } else {
          confirmGroup.classList.add('hidden');
          usernameRules.classList.add('hidden');
          passwordRules.classList.add('hidden');
          submitBtn.textContent = 'Login & Start Quiz';
          passwordInput.autocomplete = 'current-password';
        }
        banner.classList.remove('show');
        checkAll();
      });
    });

    function validateUsername(value) {
      const rules = {
        len: value.length >= 8,
        space: !value.includes(' '),
        digit: !/[\d]/.test(value)
      };
      updateRule('rule-len', rules.len);
      updateRule('rule-space', rules.space);
      updateRule('rule-digit', rules.digit);
      const isValid = rules.len && rules.space && rules.digit;
      const feedback = document.getElementById('usernameFeedback');

      if (!value) {
        feedback.textContent = '';
        usernameInput.classList.remove('valid', 'invalid');
      } else if (mode === 'login') {
        feedback.textContent = '';
        usernameInput.classList.remove('valid', 'invalid');
        return value.length > 0;
      } else if (isValid) {
        feedback.textContent = 'Looks good';
        feedback.className = 'feedback success';
        usernameInput.classList.add('valid');
        usernameInput.classList.remove('invalid');
      } else {
        let msg = !rules.len ? 'At least 8 characters'
                : !rules.space ? 'No spaces allowed'
                : 'No digits allowed';
        feedback.textContent = msg;
        feedback.className = 'feedback error';
        usernameInput.classList.add('invalid');
        usernameInput.classList.remove('valid');
      }
      return mode === 'login' ? value.length > 0 : isValid;
    }

    function validatePassword(value) {
      const rules = {
        len: value.length >= 7,
        digit: /\d/.test(value),
        upper: /[A-Z]/.test(value)
      };
      updateRule('rule-plen', rules.len);
      updateRule('rule-pdigit', rules.digit);
      updateRule('rule-pupper', rules.upper);
      const isValid = rules.len && rules.digit && rules.upper;
      const feedback = document.getElementById('passwordFeedback');

      if (!value) {
        feedback.textContent = '';
        passwordInput.classList.remove('valid', 'invalid');
      } else if (mode === 'login') {
        feedback.textContent = '';
        passwordInput.classList.remove('valid', 'invalid');
        return value.length > 0;
      } else if (isValid) {
        feedback.textContent = 'Strong enough';
        feedback.className = 'feedback success';
        passwordInput.classList.add('valid');
        passwordInput.classList.remove('invalid');
      } else {
        let msg = !rules.len ? 'At least 7 characters'
                : !rules.digit ? 'Add at least one digit'
                : 'Add an uppercase letter';
        feedback.textContent = msg;
        feedback.className = 'feedback error';
        passwordInput.classList.add('invalid');
        passwordInput.classList.remove('valid');
      }
      return mode === 'login' ? value.length > 0 : isValid;
    }

    function validateConfirm(password, confirm) {
      if (mode === 'login') return true;
      const feedback = document.getElementById('confirmFeedback');
      const isValid = confirm.length > 0 && password === confirm;
      if (!confirm) {
        feedback.textContent = '';
        confirmInput.classList.remove('valid', 'invalid');
      } else if (isValid) {
        feedback.textContent = 'Passwords match';
        feedback.className = 'feedback success';
        confirmInput.classList.add('valid');
        confirmInput.classList.remove('invalid');
      } else {
        feedback.textContent = 'Passwords do not match';
        feedback.className = 'feedback error';
        confirmInput.classList.add('invalid');
        confirmInput.classList.remove('valid');
      }
      return isValid;
    }

    function updateRule(id, met) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle('met', met);
      el.querySelector('.icon').textContent = met ? '✓' : '○';
    }

    function checkAll() {
      const uOk = validateUsername(usernameInput.value);
      const pOk = validatePassword(passwordInput.value);
      const cOk = validateConfirm(passwordInput.value, confirmInput.value);
      submitBtn.disabled = !(uOk && pOk && cOk);
      banner.classList.remove('show');
    }

    usernameInput.addEventListener('input', checkAll);
    passwordInput.addEventListener('input', checkAll);
    confirmInput.addEventListener('input', checkAll);

    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = document.getElementById(btn.dataset.target);
        const isPassword = target.type === 'password';
        target.type = isPassword ? 'text' : 'password';
        btn.textContent = isPassword ? '🙈' : '👁';
      });
    });

    function showBanner(message, type) {
      banner.textContent = message;
      banner.className = 'banner show ' + type;
    }

    document.getElementById('validatorForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.disabled = true;
      submitBtn.textContent = mode === 'register' ? 'Creating account...' : 'Signing in...';

      const payload = {
        username: usernameInput.value.trim(),
        password: passwordInput.value,
        confirm: confirmInput.value
      };
      const endpoint = mode === 'register' ? '/api/register' : '/api/login';

      try {
        const res = await fetch(API + endpoint, {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          showBanner(data.message + ' Opening quiz...', 'success');
          setTimeout(() => {
            window.location.href = data.redirect || '/quiz';
          }, 700);
        } else {
          showBanner(data.error || 'Something went wrong', 'error');
          submitBtn.textContent = mode === 'register' ? 'Register & Start Quiz' : 'Login & Start Quiz';
          checkAll();
        }
      } catch (err) {
        showBanner('Cannot reach server. Is it running?', 'error');
        submitBtn.textContent = mode === 'register' ? 'Register & Start Quiz' : 'Login & Start Quiz';
        checkAll();
      }
    });
  </script>
</body>
</html>
